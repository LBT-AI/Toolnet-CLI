name: ToolNet CLI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun test --parallel=1

      - name: Build Bun and Node bundles
        run: bun run build

      - name: Bun smoke test
        run: bun dist/index.js --help

      - name: Node 22 smoke test
        run: node dist/node/index.js --help

      - name: Build Node persistence smoke bundle
        run: bun build scripts/node-persistence-smoke.ts --target=node --outfile=/tmp/toolnet-node-persistence-smoke.mjs

      - name: Node 22 native SQLite persistence smoke test
        run: node /tmp/toolnet-node-persistence-smoke.mjs

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node 20 fallback persistence smoke test
        run: node /tmp/toolnet-node-persistence-smoke.mjs

      - name: Node 20 CLI smoke test
        run: node dist/node/index.js --help

      - name: Launcher smoke test
        run: node bin/toolnet.js --version

      - name: NPM package dry run
        run: npm pack --dry-run
