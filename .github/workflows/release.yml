name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binaries
        run: |
          mkdir -p dist-bin
          bun run build:bin:linux-x64
          bun run build:bin:linux-arm64
          bun run build:bin:darwin-x64
          bun run build:bin:darwin-arm64
          bun run build:bin:win-x64

      - name: Archive artifacts
        run: |
          cd dist-bin
          tar -czvf toolnet-linux-x64.tar.gz toolnet-linux-x64
          tar -czvf toolnet-linux-arm64.tar.gz toolnet-linux-arm64
          tar -czvf toolnet-darwin-x64.tar.gz toolnet-darwin-x64
          tar -czvf toolnet-darwin-arm64.tar.gz toolnet-darwin-arm64
          zip toolnet-windows-x64.zip toolnet-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/toolnet-linux-x64.tar.gz
            dist-bin/toolnet-linux-arm64.tar.gz
            dist-bin/toolnet-darwin-x64.tar.gz
            dist-bin/toolnet-darwin-arm64.tar.gz
            dist-bin/toolnet-windows-x64.zip
          generate_release_notes: true
